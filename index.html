<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowFlow || 智能护肤管理系统 v2.1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            background-color: #0a051b;
            color: #e2e8f0;
            font-family: 'Noto Sans SC', sans-serif;
            background-image: radial-gradient(circle at 50% 20%, #1e0b36 0%, #0a051b 80%);
        }

        .cyber-brand {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
        }

        .neon-border-blue {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            border: 1px solid rgba(0, 242, 254, 0.4);
        }

        .neon-text-pink {
            text-shadow: 0 0 8px #ff007f;
        }

        .neon-text-blue {
            text-shadow: 0 0 8px #00f2fe;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a051b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b2d54;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f2fe;
        }

        .breathing-glow {
            animation: breathe 3s infinite alternate;
        }

        @keyframes breathe {
            0% { box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
            100% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); }
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Banner -->
    <header class="border-b border-purple-900 bg-black/40 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-cyan-400 breathing-glow"></div>
                <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 cyber-brand">GlowFlow</h1>
                <span class="text-xs bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded border border-cyan-800/50">v2.1 全修复版</span>
            </div>
            <!-- Tab Buttons -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button id="btn-routine" onclick="switchTab('routine')" class="px-5 py-2 rounded-lg font-medium text-sm transition-all duration-300 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20">
                    🗓️ 周程日程表
                </button>
                <button id="btn-inventory" onclick="switchTab('inventory')" class="px-5 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-slate-400 hover:text-slate-200">
                    🧪 护肤品资产库
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-4 space-y-4">

        <!-- ==================== PERSISTENT API KEY CONFIG ==================== -->
        <div class="bg-slate-950/40 backdrop-blur-md rounded-2xl p-4 border border-slate-800/80 shadow-xl">
            <details class="group" id="api-panel">
                <summary class="text-xs font-medium text-slate-400 cursor-pointer select-none flex items-center justify-between">
                    <span class="flex items-center gap-2 text-cyan-400 font-semibold">🔑 硅基流动 SiliconFlow API 密钥密道</span>
                    <span class="text-[10px] text-slate-500 group-open:hidden">点击配置密匙 ▾</span>
                    <span class="text-[10px] text-slate-500 hidden group-open:inline">点击收起面板 ▴</span>
                </summary>
                <div class="mt-3 flex flex-col sm:flex-row gap-3">
                    <input type="password" id="api-key-input" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 placeholder-slate-600" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
                    <button onclick="saveApiKey()" class="bg-cyan-950 hover:bg-cyan-900 border border-cyan-800 text-cyan-400 text-xs px-4 py-1.5 rounded-xl transition font-medium">
                        保存密钥
                    </button>
                </div>
            </details>
        </div>
        
        <!-- ==================== TAB 1: ROUTINE SCHEDULE ==================== -->
        <section id="tab-routine-section" class="block space-y-4">
            <div class="bg-slate-950/60 backdrop-blur-md rounded-2xl p-5 border border-slate-800/80 shadow-2xl">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                    <div>
                        <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
                            <span>🗓️</span> 独立高效周日程表
                        </h2>
                        <p class="text-xs text-slate-400 mt-1">此版日程与产品库彻底解耦，您可以随时随地像自由改文本一样复制、粘帖、改动您的计划，完全不会报错。</p>
                    </div>
                    <div class="flex gap-2 self-stretch md:self-auto">
                        <button onclick="resetRoutineToDefault()" class="flex-1 md:flex-none text-xs bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-700 px-3 py-2 rounded-xl transition">
                            恢复经典推荐计划
                        </button>
                        <button onclick="exportRoutineToCSV()" class="flex-1 md:flex-none text-xs bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white px-4 py-2 rounded-xl shadow-lg shadow-purple-500/20 transition">
                            📊 导出Excel表格
                        </button>
                    </div>
                </div>

                <!-- Fast Bulk Text Importer -->
                <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-4 mb-6">
                    <details class="group" open>
                        <summary class="text-sm font-medium text-purple-400 cursor-pointer select-none flex items-center justify-between">
                            <span>⚡ 快捷全文本一键照搬/备份面板</span>
                            <span class="text-xs text-slate-500 group-open:hidden">点击展开 ▾</span>
                            <span class="text-xs text-slate-500 hidden group-open:inline">点击收起 ▴</span>
                        </summary>
                        <div class="mt-3 space-y-3">
                            <p class="text-xs text-slate-400">您可以直接把大段护肤文案粘贴到下面。点击提取后，每一天独立的早/晚输入框会自动更新覆盖。</p>
                            <textarea id="bulk-import-area" rows="6" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 focus:outline-none focus:border-purple-500 placeholder-slate-600" placeholder="粘贴您的计划文本，例如：
周一：
早：水，精华，面霜，防晒
晚：水，水杨酸棉片，眼霜，面霜"></textarea>
                            <div class="flex gap-2 justify-end">
                                <button onclick="handleBulkExtract()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-4 py-2 rounded-lg transition font-medium">
                                    ⚙️ 自动尝试提取并填入各文本框
                                </button>
                            </div>
                        </div>
                    </details>
                </div>

                <!-- Weekly Grid Dynamic Grid Structure -->
                <div class="grid grid-cols-1 gap-4" id="weekly-days-container">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>

        <!-- ==================== TAB 2: INVENTORY MANAGEMENT ==================== -->
        <section id="tab-inventory-section" class="hidden space-y-4">
            <!-- Add Product Form -->
            <div class="bg-slate-950/60 backdrop-blur-md rounded-2xl p-5 border border-slate-800/80 shadow-2xl">
                <h2 class="text-xl font-bold text-pink-500 mb-4 flex items-center gap-2">
                    <span>🧪</span> 录入新护肤资产
                </h2>
                <form id="product-form" onsubmit="handleProductSubmit(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">产品名称 *</label>
                        <input type="text" id="prod-name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500" placeholder="例如：雅诗兰黛微精华">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">护肤品类</label>
                        <select id="prod-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                            <option value="保湿水">卸妆/洁面/保湿水</option>
                            <option value="精华">功效精华液</option>
                            <option value="面霜">乳液/乳霜/面霜</option>
                            <option value="面膜/眼霜/特殊处理">面膜/眼霜/特殊处理</option>
                            <option value="防晒">防晒隔离</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">主打功效描述</label>
                        <input type="text" id="prod-effect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500" placeholder="如：维稳修护、强韧肌底">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-rose-600 hover:opacity-90 text-white font-medium py-2 rounded-xl text-sm shadow-lg shadow-pink-500/20 transition">
                            ➕ 添加至资产库
                        </button>
                    </div>
                </form>
            </div>

            <!-- Product Cards Display -->
            <div class="bg-slate-950/60 backdrop-blur-md rounded-2xl p-5 border border-slate-800/80 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">
                            <span>📦</span> 当前储备物资清单 (<span id="product-count" class="text-pink-500">0</span>)
                        </h2>
                    </div>
                    <button onclick="clearAllProducts()" class="text-xs text-rose-400 border border-rose-950 hover:bg-rose-950/30 px-3 py-1.5 rounded-xl transition">
                        清空资产库
                    </button>
                </div>

                <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Cards injection container -->
                </div>
            </div>
        </section>

    </main>

    <script>
        const defaultRoutineText = {
            1: { morning: "雅诗兰黛微精华、珀莱雅双抗、兰蔻眼霜、珂润面霜、防晒", night: "雅诗兰黛微精华、Stridex水杨酸棉片（局部）、雅诗兰黛眼霜、珂润面霜" },
            2: { morning: "雅诗兰黛微精华、兰蔻眼霜、优时颜乳液/珂润面霜、防晒", night: "雅诗兰黛微精华、雅诗兰黛眼霜、理肤泉B5面霜（修护）" },
            3: { morning: "优时颜水、珀莱雅双抗、兰蔻眼霜、优时颜乳液、防晒", night: "雅诗兰黛微精华、自然堂小紫瓶精华霜 或 粉钻玫瑰霜、雅诗兰黛眼霜、珂润面霜" },
            4: { morning: "优时颜水、珀莱雅双抗、兰蔻眼霜、优时颜乳液、防晒", night: "雅诗兰黛微精华、自然堂小紫瓶精华霜 或 粉钻玫瑰霜、雅诗兰黛眼霜、珂润面霜" },
            5: { morning: "优时颜水、珀莱雅双抗、兰蔻眼霜、优时颜乳液、防晒", night: "雅诗兰黛微精华、Olay ProX白瓶精华（重点淡印）、雅诗兰黛眼霜、珂润面霜" },
            6: { morning: "雅诗兰黛微精华、珀莱雅双抗、兰蔻眼霜、珂润面霜、防晒", night: "雅诗兰黛微精华、养生堂冬孕精华液、雅诗兰黛眼霜、珂润面霜" },
            0: { morning: "清水洗脸、珂润面霜、防晒", night: "雅诗兰黛微精华（或温和保湿水）、珂润面霜" }
        };

        const defaultInventory = [
            { id: "i1", name: "雅诗兰黛微精华", category: "保湿水", effect: "维稳修护、强韧肌底" },
            { id: "i2", name: "珀莱雅双抗", category: "精华", effect: "抗氧化、去黄提亮" },
            { id: "i3", name: "兰蔻眼霜", category: "面膜/眼霜/特殊处理", effect: "淡化眼纹、滋润眼周" },
            { id: "i4", name: "珂润面霜", category: "面霜", effect: "温和保湿、锁水修护" },
            { id: "i5", name: "Stridex水杨酸棉片", category: "面膜/眼霜/特殊处理", effect: "局部疏通、KO闭口" },
            { id: "i6", name: "理肤泉B5面霜", category: "面霜", effect: "深层舒缓、褪红修护" },
            { id: "i7", name: "自然堂小紫瓶精华霜", category: "面霜", effect: "黄金抗老、紧致提拉" },
            { id: "i8", name: "Olay ProX白瓶精华", category: "精华", effect: "全脸美白、重点淡印" },
            { id: "i9", name: "养生堂冬孕精华液", category: "精华", effect: "温和滋养、补充脂质" }
        ];

        const weekdayNames = {
            1: "周一 ➔ 局部疏通日 (KO闭口)",
            2: "周二 ➔ 深度修护日 (给皮肤放假)",
            3: "周三 ➔ 黄金抗老抗衰日 (主场)",
            4: "周四 ➔ 黄金抗老抗衰日 (主场)",
            5: "周五 ➔ 美白淡印日",
            6: "周六 ➔ 温和滋养日",
            0: "周日 ➔ 肌断食日"
        };

        // Initialize reactive memory
        let currentRoutine = JSON.parse(localStorage.getItem('glowflow_routine')) || defaultRoutineText;
        let currentProducts = JSON.parse(localStorage.getItem('glowflow_products')) || defaultInventory;

        window.onload = function() {
            // Load stored API Key if exists
            const savedKey = localStorage.getItem('glowflow_api_key') || '';
            document.getElementById('api-key-input').value = savedKey;
            
            renderRoutineSchedule();
            renderProductsGrid();
            highlightToday();
        };

        function saveApiKey() {
            const keyVal = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('glowflow_api_key', keyVal);
            alert('🔑 API 密钥已加密存储到当前设备本地！');
        }

        function switchTab(tab) {
            const rotSect = document.getElementById('tab-routine-section');
            const invSect = document.getElementById('tab-inventory-section');
            const btnRot = document.getElementById('btn-routine');
            const btnInv = document.getElementById('btn-inventory');

            if (tab === 'routine') {
                rotSect.classList.remove('hidden');
                invSect.classList.add('hidden');
                btnRot.className = "px-5 py-2 rounded-lg font-medium text-sm transition-all duration-300 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20";
                btnInv.className = "px-5 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-slate-400 hover:text-slate-200";
            } else {
                rotSect.classList.add('hidden');
                invSect.classList.remove('hidden');
                btnInv.className = "px-5 py-2 rounded-lg font-medium text-sm transition-all duration-300 bg-gradient-to-r from-pink-500 to-rose-600 text-white shadow-lg shadow-pink-500/20";
                btnRot.className = "px-5 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-slate-400 hover:text-slate-200";
            }
        }

        function renderRoutineSchedule() {
            const container = document.getElementById('weekly-days-container');
            if(!container) return;
            container.innerHTML = '';
            const daySequence = [1, 2, 3, 4, 5, 6, 0];
            
            daySequence.forEach(day => {
                const dayData = currentRoutine[day] || { morning: '', night: '' };
                const isSunday = day === 0;

                const dayCard = document.createElement('div');
                dayCard.id = `day-card-${day}`;
                dayCard.className = `p-4 rounded-xl border transition-all duration-300 bg-slate-900/40 border-slate-800 hover:border-slate-700`;
                
                dayCard.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/80 pb-2 mb-3">
                        <h3 class="font-bold text-sm ${isSunday ? 'text-rose-400' : 'text-slate-200'} flex items-center gap-2">
                            <span class="inline-block w-2 h-2 rounded-full ${isSunday ? 'bg-rose-500' : 'bg-cyan-500'}"></span>
                            ${weekdayNames[day]}
                        </h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-950/40 p-3 rounded-lg border border-slate-900">
                            <div class="text-xs font-semibold text-amber-400 mb-1.5">☀️ 早晨日程：</div>
                            <input type="text" 
                                   value="${dayData.morning}" 
                                   oninput="updateSingleDayValue(${day}, 'morning', this.value)"
                                   class="w-full bg-slate-900/80 border border-slate-800 rounded-lg px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500" 
                                   placeholder="可以直接照搬输入流程...">
                        </div>
                        <div class="bg-slate-950/40 p-3 rounded-lg border border-slate-900">
                            <div class="text-xs font-semibold text-indigo-400 mb-1.5">🌙 晚间日程：</div>
                            <input type="text" 
                                   value="${dayData.night}" 
                                   oninput="updateSingleDayValue(${day}, 'night', this.value)"
                                   class="w-full bg-slate-900/80 border border-slate-800 rounded-lg px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500" 
                                   placeholder="可以直接照搬输入流程...">
                        </div>
                    </div>
                `;
                container.appendChild(dayCard);
            });
        }

        function updateSingleDayValue(day, timeKey, value) {
            if (!currentRoutine[day]) currentRoutine[day] = { morning: '', night: '' };
            currentRoutine[day][timeKey] = value;
            localStorage.setItem('glowflow_routine', JSON.stringify(currentRoutine));
        }

        function highlightToday() {
            const today = new Date().getDay();
            const targetCard = document.getElementById(`day-card-${today}`);
            if (targetCard) {
                targetCard.className = "p-4 rounded-xl border transition-all duration-300 bg-slate-900/80 border-cyan-500/80 shadow-[0_0_20px_rgba(6,182,212,0.15)] ring-1 ring-cyan-500/30";
                const heading = targetCard.querySelector('h3');
                if (heading && !heading.innerHTML.includes('TODAY')) {
                    heading.innerHTML += ` <span class="text-[10px] bg-cyan-500 text-slate-950 px-1.5 py-0.5 rounded font-bold ml-2">TODAY 今天</span>`;
                }
            }
        }

        function resetRoutineToDefault() {
            if(confirm("确定要恢复默认定制的周计划吗？")) {
                currentRoutine = {...defaultRoutineText};
                localStorage.setItem('glowflow_routine', JSON.stringify(currentRoutine));
                renderRoutineSchedule();
                highlightToday();
            }
        }

        function handleBulkExtract() {
            const text = document.getElementById('bulk-import-area').value.trim();
            if (!text) {
                alert("请输入大段护肤计划文本！");
                return;
            }

            const lines = text.split('\n');
            let matchedDay = null;

            lines.forEach(line => {
                let currentLine = line.trim();
                if (!currentLine) return;

                if (currentLine.includes("周一") || currentLine.includes("星期一")) matchedDay = 1;
                else if (currentLine.includes("周二") || currentLine.includes("星期二")) matchedDay = 2;
                else if (currentLine.includes("周三") || currentLine.includes("星期三")) matchedDay = 3;
                else if (currentLine.includes("周四") || currentLine.includes("星期四")) matchedDay = 4;
                else if (currentLine.includes("周五") || currentLine.includes("星期五")) matchedDay = 5;
                else if (currentLine.includes("周六") || currentLine.includes("星期六")) matchedDay = 6;
                else if (currentLine.includes("周日") || currentLine.includes("星期日") || currentLine.includes("周天")) matchedDay = 0;

                if (matchedDay !== null) {
                    if (currentLine.startsWith("早：") || currentLine.startsWith("早") || currentLine.includes("早晨：")) {
                        currentRoutine[matchedDay].morning = currentLine.replace(/早：|早/g, '').trim();
                    }
                    if (currentLine.startsWith("晚：") || currentLine.startsWith("晚") || currentLine.includes("晚间：")) {
                        currentRoutine[matchedDay].night = currentLine.replace(/晚：|晚/g, '').trim();
                    }
                }
            });

            localStorage.setItem('glowflow_routine', JSON.stringify(currentRoutine));
            renderRoutineSchedule();
            highlightToday();
            alert("✨ 提取匹配成功！");
        }

        function exportRoutineToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,﻿";
            csvContent += "日期,时间段,护肤步骤细节
";
            const daySequence = [1, 2, 3, 4, 5, 6, 0];
            const nameMap = {1:"周一", 2:"周二", 3:"周三", 4:"周四", 5:"周五", 6:"周六", 0:"周日"};

            daySequence.forEach(d => {
                let m = (currentRoutine[d]?.morning || "").replace(/,/g, "，");
                let n = (currentRoutine[d]?.night || "").replace(/,/g, "，");
                csvContent += `${nameMap[d]},早晨流程,"${m}"
`;
                csvContent += `${nameMap[d]},晚间流程,"${n}"
`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "GlowFlow_我的护肤周日程表.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderProductsGrid() {
            const grid = document.getElementById('products-grid');
            const countSpan = document.getElementById('product-count');
            if(!grid || !countSpan) return;
            grid.innerHTML = '';
            countSpan.innerText = currentProducts.length;

            if (currentProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-slate-500">📦 资产库目前空空如也。</div>`;
                return;
            }

            currentProducts.forEach((prod) => {
                const card = document.createElement('div');
                card.className = "p-4 bg-slate-900/60 rounded-xl border border-slate-800 flex flex-col justify-between hover:border-slate-700 transition";
                
                let badgeColor = "bg-slate-800 text-slate-400";
                if(prod.category === "精华") badgeColor = "bg-purple-950 text-purple-400 border border-purple-900";
                else if(prod.category === "保湿水") badgeColor = "bg-cyan-950 text-cyan-400 border border-cyan-900";
                else if(prod.category === "面霜") badgeColor = "bg-emerald-950 text-emerald-400 border border-emerald-900";
                else if(prod.category === "防晒") badgeColor = "bg-amber-950 text-amber-400 border border-amber-900";

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h4 class="font-bold text-sm text-slate-200">${prod.name}</h4>
                            <span class="text-[10px] px-2 py-0.5 rounded font-medium ${badgeColor}">${prod.category}</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-1"><span class="text-slate-600">主要功效：</span>${prod.effect || '未注明'}</p>
                    </div>
                    <div class="mt-4 pt-2 border-t border-slate-800/60 flex justify-end">
                        <button onclick="deleteProduct('${prod.id}')" class="text-[11px] text-rose-400/80 hover:text-rose-400 transition">🗑️ 移除资产</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById('prod-name');
            const catSelect = document.getElementById('prod-category');
            const effInput = document.getElementById('prod-effect');

            const newProduct = {
                id: 'i_' + Date.now(),
                name: nameInput.value.trim(),
                category: catSelect.value,
                effect: effInput.value.trim()
            };

            currentProducts.unshift(newProduct);
            localStorage.setItem('glowflow_products', JSON.stringify(currentProducts));
            nameInput.value = '';
            effInput.value = '';
            renderProductsGrid();
        }

        function deleteProduct(id) {
            currentProducts = currentProducts.filter(p => p.id !== id);
            localStorage.setItem('glowflow_products', JSON.stringify(currentProducts));
            renderProductsGrid();
        }

        function clearAllProducts() {
            if(confirm("确定要全部清空您的物资资产库吗？")) {
                currentProducts = [];
                localStorage.setItem('glowflow_products', JSON.stringify(currentProducts));
                renderProductsGrid();
            }
        }
    </script>
</body>
</html>
